<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#0B1224"/>
    <stop offset="100%" stop-color="#101B38"/>
  </linearGradient>

  <radialGradient id="cyanGlow">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="purpleGlow">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="textGradient" x1="0" y1="0" x2="600" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#9DD9FF"/>
  </linearGradient>

  <filter id="glass">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22D3EE" flood-opacity="0.25"/>
  </filter>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#23324E" stroke-opacity="0.22"/>
  </pattern>
</defs>

<rect width="1280" height="320" fill="url(#bg)"/>
<rect width="1280" height="320" fill="url(#grid)"/>

<circle cx="160" cy="70" r="180" fill="url(#cyanGlow)">
<animate attributeName="cx" values="160;190;160" dur="9s" repeatCount="indefinite"/>
</circle>

<circle cx="1140" cy="250" r="220" fill="url(#purpleGlow)">
<animate attributeName="cy" values="250;220;250" dur="10s" repeatCount="indefinite"/>
</circle>

<g stroke="#5EEBFF" stroke-opacity="0.28" stroke-width="1.3">
 <line x1="860" y1="65" x2="960" y2="110"/>
 <line x1="960" y1="110" x2="1090" y2="80"/>
 <line x1="1090" y1="80" x2="1180" y2="145"/>
 <line x1="960" y1="110" x2="1025" y2="200"/>
 <line x1="1025" y1="200" x2="1165" y2="225"/>
 <line x1="900" y1="180" x2="1025" y2="200"/>
</g>

<g fill="#67E8F9">
 <circle cx="860" cy="65" r="4"/>
 <circle cx="960" cy="110" r="4"/>
 <circle cx="1090" cy="80" r="4"/>
 <circle cx="1180" cy="145" r="4"/>
 <circle cx="1025" cy="200" r="4"/>
 <circle cx="1165" cy="225" r="4"/>
 <circle cx="900" cy="180" r="4"/>
</g>

<rect x="70" y="58" width="720" height="205" rx="22"
fill="white" fill-opacity="0.04"
stroke="white" stroke-opacity="0.08"
filter="url(#glass)"/>

<text x="110" y="98"
font-size="18"
font-family="Segoe UI, Arial, sans-serif"
fill="#22D3EE"
letter-spacing="4">
AI SYSTEMS ENGINEER
</text>

<text x="110" y="155"
font-size="52"
font-weight="700"
font-family="Segoe UI, Arial, sans-serif"
fill="url(#textGradient)"
filter="url(#shadow)">
Chakshat Bali
</text>

<text x="110" y="205"
font-size="22"
font-family="Segoe UI, Arial, sans-serif"
fill="#C8D4F2">
Building production AI systems that reason, retrieve and scale.
</text>

<text x="110" y="240"
font-size="17"
font-family="Consolas, Menlo, monospace"
fill="#8AB4F8">
Agentic AI  •  RAG  •  LLM Infrastructure  •  Python Backend
</text>

<rect x="110" y="257" width="360" height="3" rx="2" fill="#22D3EE">
<animate attributeName="width" values="0;360;360" dur="2s" repeatCount="1"/>
</rect>

</svg>
