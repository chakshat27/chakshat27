# Place this file at: .github/workflows/snake.yml
# (inside the repo named exactly after your GitHub username)
#
# What it does: on every push to main, and once a day on a schedule,
# it regenerates an animated "snake" that eats your contribution graph,
# and commits the resulting SVGs to a branch called "output".
# Your README.md already points to the dark-theme SVG on that branch.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  push:
    branches:
      - main               # change to "master" if that's your default branch
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
